[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaparral-mcp"
version = "0.1.0"
description = "MCP server exposing Chaparral proteomics data to AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chaparral Labs", email = "support@chaparral.ai" }]
keywords = ["proteomics", "mcp", "ai", "chaparral", "dda", "dia", "prm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  "chaparral>=0.3.0",
  "mcp>=1.0.0",
]

[project.scripts]
chaparral-mcp = "chaparral_mcp.server:main"

[project.urls]
Homepage = "https://chaparral.ai"
Repository = "https://github.com/ChaparralLabs/chaparral-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/chaparral_mcp"]
